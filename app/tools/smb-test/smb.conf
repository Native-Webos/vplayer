[global]
   server role = standalone server
   workgroup = WORKGROUP
   netbios name = VPLAYER-TEST
   server min protocol = SMB2_02
   server max protocol = SMB3
   map to guest = Never
   disable netbios = yes
   smb ports = 445
   log level = 1
   load printers = no
   printing = bsd
   printcap name = /dev/null

# The test media, read-only, for the user made by entry.sh.
[media]
   path = /share
   read only = yes
   browseable = yes
   valid users = vplayer
